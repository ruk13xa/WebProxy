<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebProxy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 24px;
    }
    form {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 640px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 1rem;
    }
    button {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    p.hint {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1>웹 프록시</h1>
  <form id="proxy-form">
    <input type="text" id="url-input" placeholder="https://example.com" required />
    <button type="submit">이동</button>
  </form>
  <p class="hint">입력한 URL의 페이지를 프록시를 통해 불러옵니다.</p>

  <script>
    const form = document.getElementById('proxy-form');
    const input = document.getElementById('url-input');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let value = input.value.trim();
      if (!/^https?:\/\//i.test(value)) {
        value = 'https://' + value;
      }
      window.location.href = '/proxy?url=' + encodeURIComponent(value);
    });
  </script>
</body>
</html>
